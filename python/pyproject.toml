[project]
name = "urun-sense"
version = "0.1.11"
description = "Python SDK for the Sense realtime decision protocol"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Urun Platform, Inc" }]
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "truststore>=0.10"]

[project.optional-dependencies]
# Transport extras: the core wire is WebSocket; QUIC (WebTransport) and
# WebRTC are opt-in and feature-detected at dial time.
quic = ["aioquic>=1.2", "msgpack>=1.0"]
webrtc = ["aiortc>=1.9"]
# Everything the shipped cheese demo needs beyond the SDK itself.
demo = ["rich>=13", 'sounddevice>=0.5; sys_platform != "linux"']

[project.urls]
Homepage = "https://github.com/urun-sh/sense-sdk"
Repository = "https://github.com/urun-sh/sense-sdk"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sense"]

[dependency-groups]
dev = ["pytest>=8", "rich>=13"]
