[project]
name = "urun-sense"
version = "0.1.13"
description = "Python SDK for the Sense realtime decision protocol"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Urun Platform, Inc" }]
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "truststore>=0.10"]

[project.optional-dependencies]
# Transport extras: the core wire is WebSocket; QUIC (WebTransport) and
# WebRTC are opt-in and feature-detected at dial time.
quic = ["aioquic>=1.2", "msgpack>=1.0"]
webrtc = ["aiortc>=1.9"]
# Everything the shipped cheese demo needs beyond the SDK itself.
demo = ["rich>=13", 'sounddevice>=0.5; sys_platform != "linux"']

[project.urls]
Homepage = "https://github.com/urun-sh/sense-sdk"
Repository = "https://github.com/urun-sh/sense-sdk"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sense"]

# The demos' committed source lives at the repo root (../examples from here);
# python/hatch_build.py stages it into src/sense/examples before every build
# so the wheel keeps shipping the examples. No-op when building from an sdist.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8", "rich>=13"]
