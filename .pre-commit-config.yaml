# Ruff is pinned to the same version the CI lint gate runs.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # The TypeScript analogue of ruff-check: fast, and it needs no
      # node_modules. bun test still runs only as a CI gate (see below).
      - id: oxlint
        name: oxlint (typescript)
        entry: bash -c 'cd typescript && if command -v bun >/dev/null 2>&1; then exec bunx oxlint@1.91.0; else exec npx --yes oxlint@1.91.0; fi'
        language: system
        pass_filenames: false
        files: '^typescript/.+\.(ts|tsx|mjs|js)$|^examples/typescript/.+\.(ts|tsx)$'
        stages: [pre-commit]
      # bun is required here (the lockfile and @types/bun come from its
      # install); node_modules is installed automatically on first run.
      # dist and the staged examples are built first — the same steps as
      # `npm run build`, run bun-natively so a Bun-only machine without
      # npm can still commit: tsconfig typechecks typescript/examples
      # (staged from ../examples/typescript), whose demo imports
      # @urun-sh/sense (resolves to dist declarations).
      - id: typecheck
        name: tsc --noEmit (typescript)
        entry: bash -c 'cd typescript && bun install --frozen-lockfile && bunx tsc -p tsconfig.build.json && bun scripts/fix-dts.mjs && bun scripts/stage-assets.mjs && exec bunx tsc --noEmit'
        language: system
        pass_filenames: false
        files: '^typescript/.+\.(ts|tsx|mjs|js)$|^typescript/(tsconfig[^/]*\.json|package\.json)$|^examples/typescript/.+\.(ts|tsx)$'
        stages: [pre-commit]
