version: 2
updates:
  # Cooldown: pass over versions released less than 7 days ago, so a
  # compromised upstream release is less likely to be adopted before
  # anyone notices it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: bun
    directory: /typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
