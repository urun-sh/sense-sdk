version: 2
updates:
  # Cooldown: pass over versions released less than 7 days ago, so a
  # compromised upstream release is less likely to be adopted before
  # anyone notices it. Version updates only: Dependabot security updates
  # ignore the cooldown and may still propose a release younger than 7
  # days.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: bun
    directory: /typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
